<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Editor — Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="lib/tinymce/tinymce.min.js"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>Admin Panel</h2><small>Technology Innovations</small></div>
            <nav class="sidebar-nav">
                <a href="index.html"><span class="nav-icon">&#9632;</span> Dashboard</a>
                <a href="posts.html"><span class="nav-icon">&#9998;</span> Posts</a>
                <a href="comments.html"><span class="nav-icon">&#9993;</span> Comments</a>
                <a href="contacts.html"><span class="nav-icon">&#9742;</span> Contacts</a>
                <a href="newsletter.html"><span class="nav-icon">&#9993;</span> Newsletter</a>
                <a href="visitors.html"><span class="nav-icon">&#9788;</span> Visitors</a>
            </nav>
            <div class="sidebar-footer"><a href="#" onclick="logout(); return false;">Sign Out</a></div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <button class="mobile-toggle" aria-label="Toggle menu">&#9776;</button>
                <h1 id="pageTitle">New Post</h1>
                <div class="topbar-actions">
                    <a href="posts.html" class="btn btn-outline btn-sm">Back to Posts</a>
                </div>
            </div>

            <div class="page-content">
                <form id="postForm">
                    <div class="card">
                        <div class="card-body">
                            <div class="form-group">
                                <label for="title">Title</label>
                                <input type="text" id="title" class="form-control" required>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="slug">Slug</label>
                                    <input type="text" id="slug" class="form-control" placeholder="Auto-generated from title">
                                </div>
                                <div class="form-group">
                                    <label for="category">Category</label>
                                    <select id="category" class="form-control" required>
                                        <option value="">Select category</option>
                                        <option value="Digital Strategy">Digital Strategy</option>
                                        <option value="Cybersecurity & Resilience">Cybersecurity & Resilience</option>
                                        <option value="Project Lessons">Project Lessons</option>
                                        <option value="Industry Trends & Regulation">Industry Trends & Regulation</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="status">Status</label>
                                    <select id="status" class="form-control">
                                        <option value="draft">Draft</option>
                                        <option value="published">Published</option>
                                        <option value="archived">Archived</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="reading_time">Reading Time</label>
                                    <input type="text" id="reading_time" class="form-control" placeholder="e.g. 8 min read">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="author">Author</label>
                                    <input type="text" id="author" class="form-control" value="Toby R. Louris">
                                </div>
                                <div class="form-group">
                                    <label for="image_url">Image URL</label>
                                    <div style="display: flex; gap: 8px; align-items: center;">
                                        <input type="text" id="image_url" class="form-control" placeholder="https://... or upload an image" style="flex: 1;">
                                        <label class="btn btn-outline btn-sm" style="cursor: pointer; white-space: nowrap; margin: 0;">
                                            Upload
                                            <input type="file" id="imageFile" accept="image/jpeg,image/png,image/gif,image/webp" style="display: none;" onchange="uploadImage(this)">
                                        </label>
                                    </div>
                                    <div id="imagePreview" style="margin-top: 8px; display: none;">
                                        <img id="imagePreviewImg" src="" alt="Preview" style="max-width: 200px; max-height: 140px; border-radius: 6px; border: 1px solid var(--border-color, #ddd);">
                                    </div>
                                </div>
                            </div>

                            <div class="form-check" style="margin-bottom: 20px;">
                                <input type="checkbox" id="featured">
                                <label for="featured">Featured Post</label>
                            </div>

                            <div class="form-group">
                                <label for="excerpt">Excerpt</label>
                                <textarea id="excerpt" class="form-control" rows="3" required placeholder="Brief description shown in post listings..."></textarea>
                            </div>

                            <div class="form-group">
                                <label for="content">Content</label>
                                <textarea id="content"></textarea>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; justify-content: flex-end;">
                        <a href="posts.html" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary" id="saveBtn">Save Post</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/admin-common.js"></script>
    <script src="js/admin-editor.js"></script>
</body>
</html>
