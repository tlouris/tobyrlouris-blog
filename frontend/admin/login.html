<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Technology Innovations</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1>Admin Panel</h1>
            <p class="subtitle">Technology Innovations for Water</p>

            <div id="loginError" class="login-error"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost'
            ? 'http://localhost:8000/api/admin'
            : `${window.location.protocol}//${window.location.hostname}/api/admin`;

        // If already authenticated, redirect to dashboard
        fetch(`${API_BASE}/session`, { credentials: 'include' })
            .then(r => { if (r.ok) window.location.href = 'index.html'; })
            .catch(() => {});

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            errorEl.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                if (res.ok) {
                    window.location.href = 'index.html';
                } else {
                    const data = await res.json().catch(() => ({}));
                    errorEl.textContent = data.detail || 'Invalid credentials';
                    errorEl.classList.add('visible');
                }
            } catch {
                errorEl.textContent = 'Unable to connect to server';
                errorEl.classList.add('visible');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
